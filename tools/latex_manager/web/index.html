<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LaTeX 宏包管理 · Reader</title>
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" class="latex-icon-svg">
          <rect width="36" height="36" rx="9" fill="#2563eb"/>
          <path d="M9.5 13h7.5v2H14.5v10h-2.5V15H9.5v-2zm8.8 3.2h7.2v1.8h-4.9v2.2h4.2v1.7h-4.2v2.4h5V26h-7.3v-9.8z" fill="#fff"/>
          <circle cx="28" cy="11" r="2.2" fill="#93c5fd"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1 class="brand-title">LaTeX 宏包管理</h1>
        <span class="brand-sub">宏包 · 宏定义 · TikZ 环境配置</span>
      </div>
    </div>

    <div class="header-status">
      <span id="dirty-dot" class="status-dot" aria-hidden="true"></span>
      <span id="save-status" role="status">正在读取配置…</span>
    </div>

    <div class="header-actions actions">
      <button id="reload" class="btn btn-secondary" type="button">重新加载</button>
      <button id="restore" class="btn btn-secondary" type="button" disabled>恢复上一版</button>
      <button id="save" class="btn btn-primary" type="button" disabled>保存设置</button>
      <button id="quit" class="btn btn-ghost" type="button">退出</button>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar">
      <nav id="navigation" aria-label="LaTeX 配置分类"></nav>
      <div class="sidebar-footer">
        <span class="sidebar-footer-label">配置文件路径（点击复制）</span>
        <p id="config-path" title="点击复制路径"></p>
      </div>
    </aside>

    <main class="main-content">
      <div id="notice" class="notice-bar" role="status" hidden></div>
      <section class="editor card" aria-labelledby="section-title">
        <div class="section-header">
          <div class="section-meta">
            <h2 id="section-title"></h2>
            <p id="section-help"></p>
          </div>
          <button id="add" class="btn btn-primary btn-add" type="button" disabled>＋ 添加</button>
        </div>
        <div id="rows"></div>
        <p id="empty" hidden>暂无配置，点击「添加」新增。</p>
      </section>
      <p class="footer">保存后刷新阅读器生效 · 自动保留上一版 · Ctrl+S 保存</p>
    </main>
  </div>
  <script src="manager.js"></script>
</body>
</html>
