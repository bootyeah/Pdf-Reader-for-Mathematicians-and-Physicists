<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API 管理中心 · 全功能 PDF 阅读器</title>
  <link rel="stylesheet" href="/manager.css">
  <script src="/manager.js" defer></script>
</head>
<body>
  <!-- 顶栏：与 PDF 阅读器一致的 60px 扁平极简风格 -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 100 100" class="pdf-icon-svg">
          <path d="M20,5 h40 l25,25 v60 a10,10 0 0,1 -10,10 h-55 a10,10 0 0,1 -10,-10 v-75 a10,10 0 0,1 10,-10 z" fill="#ef4444"/>
          <path d="M60,5 v25 h25 z" fill="#b91c1c"/>
          <text x="50" y="72" font-family="system-ui, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle">API</text>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-title">API 管理中心</span>
      </div>
    </div>

    <!-- 极简保存状态指示 -->
    <div class="header-status">
      <span id="dirty-dot" class="status-dot"></span>
      <span id="save-status">所有更改已保存</span>
    </div>

    <!-- 顶部操作按钮组 -->
    <div class="header-actions">
      <button type="button" id="reload" class="btn btn-secondary" title="放弃未保存草稿并重新读取配置">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        <span>重新加载</span>
      </button>

      <button type="button" id="restore" class="btn btn-secondary" disabled title="使用上一版本备份覆盖当前配置">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
        <span>恢复备份</span>
      </button>

      <button type="button" id="save" class="btn btn-primary" title="保存所有设置 (Ctrl+S)">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
          <polyline points="17 21 17 13 7 13 7 21"></polyline>
          <polyline points="7 3 7 8 15 8"></polyline>
        </svg>
        <span>保存设置</span>
        <kbd class="shortcut-key">Ctrl+S</kbd>
      </button>

      <button type="button" id="quit" class="btn btn-ghost" title="退出管理工具并关闭后台服务">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>退出</span>
      </button>
    </div>
  </header>

  <!-- 主体容器 -->
  <div class="app-body">
    <!-- 侧边栏：极简 6 项直观切换 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">模型功能</span>
        <span class="sidebar-count" id="feature-count">07</span>
      </div>

      <nav id="navigation" class="nav-list" aria-label="模型功能选择"></nav>

      <!-- 侧边栏底部精简路径 -->
      <div class="sidebar-footer">
        <div class="meta-path-wrap" id="copy-path-wrap" title="点击复制配置文件路径">
          <span class="meta-path" id="config-path">—</span>
          <button type="button" id="copy-path-btn" class="btn-icon-tiny" title="复制配置文件路径">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- 工作空间 -->
    <main class="workspace">
      <!-- 提示横幅 -->
      <div id="notice" class="notice-bar" role="status" hidden></div>

      <!-- 当前选中功能的头部信息 -->
      <div class="feature-header">
        <div class="feature-meta">
          <div class="feature-title-row">
            <h1 class="feature-title" id="feature-title">内置对话</h1>
            <div class="feature-tags">
              <span class="tag tag-provider" id="feature-category">DeepSeek</span>
              <span class="tag tag-status" id="key-status">Key 已配置</span>
            </div>
          </div>
          <p class="feature-desc" id="feature-description"></p>
        </div>
      </div>

      <!-- 主编辑表单 -->
      <form id="editor" class="editor-form" autocomplete="off">
        
        <!-- 模块 1：接口与认证 -->
        <section class="card">
          <div class="card-header">
            <div class="card-header-title">
              <h2>接口与认证</h2>
              <span class="card-header-desc">API 地址与密钥配置</span>
            </div>
            <!-- 直接在接口卡片右上角放置测试连接按钮 -->
            <button type="button" id="test" class="btn btn-primary btn-sm test-btn">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span>测试当前连接</span>
            </button>
          </div>

          <div class="card-body">
            <div class="form-group">
              <label for="base_url" class="form-label">
                API 接口地址 <span class="label-hint">Base URL 或完整补全地址</span>
              </label>
              <input id="base_url" name="base_url" type="url" required spellcheck="false" class="form-input" placeholder="https://api.deepseek.com">
              <div class="field-hint endpoint" id="endpoint"></div>
            </div>

            <div class="form-row form-row-2">
              <div class="form-group">
                <label for="key_source" class="form-label">API Key 来源</label>
                <select id="key_source" name="key_source" class="form-select"></select>
              </div>

              <!-- API Key 输入窗口：默认直接以明文显示当前使用的密钥！无论独立或共用均直接呈现 -->
              <div class="form-group">
                <label for="api_key" class="form-label">
                  API Key <span class="label-hint" id="key-hint">当前使用的密钥</span>
                </label>
                <div class="input-with-actions">
                  <input id="api_key" type="text" spellcheck="false" autocomplete="off" class="form-input font-mono" placeholder="未配置 API Key">
                  <button type="button" id="copy-key" class="btn btn-secondary btn-sm" title="复制当前 API Key">复制</button>
                  <button type="button" id="show-key" class="btn btn-secondary btn-sm" title="切换显示/隐藏">隐藏</button>
                  <button type="button" id="clear-key" class="btn btn-danger-soft btn-sm" title="清空密钥">清空</button>
                </div>
              </div>
            </div>

            <!-- 共用 Key 详细状态提示 -->
            <div id="shared-key-hint" class="shared-key-pill" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="pill-icon">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
              <span id="shared-key-text">当前共用其他功能的 API Key</span>
              <button type="button" id="switch-to-own-btn" class="btn btn-secondary btn-xs" style="margin-left:auto;">切换为独立 Key</button>
            </div>

            <div id="key-warning" class="alert-box alert-warning" role="status" hidden></div>

            <!-- 测试连接结果呈现区（测试后优雅展开） -->
            <div id="test-result" class="test-result-box" hidden aria-live="polite"></div>
          </div>
        </section>

        <!-- 模块 2：模型与参数 -->
        <section class="card">
          <div class="card-header">
            <div class="card-header-title">
              <h2>模型与参数</h2>
              <span class="card-header-desc">模型名称及调用参数设置</span>
            </div>
            <button type="button" id="fetch-models" class="btn btn-secondary btn-sm" title="从接口拉取可用模型列表">
              <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span>拉取远程模型</span>
            </button>
          </div>

          <div class="card-body">
            <div class="form-row form-row-2">
              <div class="form-group">
                <label for="model" class="form-label">主要模型 <span class="required">*</span></label>
                <input id="model" name="model" list="remote-models" required spellcheck="false" class="form-input" placeholder="例如 deepseek-flash 或 glm-4.6v-flash">
                <datalist id="remote-models"></datalist>
              </div>
              <div class="form-group">
                <label for="fallback_model" class="form-label">备用模型 <span class="label-hint">可选 / 限流或拥堵时自动重试</span></label>
                <input id="fallback_model" name="fallback_model" spellcheck="false" class="form-input" placeholder="例如 deepseek-v4-flash">
              </div>
            </div>
            <div class="field-hint" id="fallback-hint"></div>

            <div class="form-row form-row-3 pt-border">
              <div class="form-group">
                <label for="temperature" class="form-label">温度 (Temperature)</label>
                <input id="temperature" name="temperature" type="number" min="0" max="2" step="0.05" required class="form-input">
              </div>
              <div class="form-group">
                <label for="timeout" class="form-label">超时时间 (秒)</label>
                <input id="timeout" name="timeout" type="number" min="1" max="600" step="1" required class="form-input">
              </div>
              <div class="form-group">
                <label for="max_tokens" class="form-label">输出 Tokens 上限 <span class="label-hint">0 为默认</span></label>
                <input id="max_tokens" name="max_tokens" type="number" min="0" max="1000000" step="1" required class="form-input">
              </div>
            </div>

            <div class="form-row form-row-2 pt-border">
              <div class="form-group">
                <label for="thinking" class="form-label">思考参数 (Thinking)</label>
                <select id="thinking" name="thinking" class="form-select">
                  <option value="disabled">关闭思考 (更快，日常推荐)</option>
                  <option value="enabled">开启思考 (深度推理)</option>
                  <option value="omit">不发送 (兼容第三方中转)</option>
                </select>
              </div>
              <div class="form-group">
                <label for="proxy" class="form-label">网络代理</label>
                <input id="proxy" name="proxy" spellcheck="false" class="form-input" placeholder="留空直连 / system / http://...">
              </div>
            </div>

            <!-- 对话窗口额外可选模型 -->
            <div id="chat-models" class="form-group pt-border">
              <label for="models" class="form-label">
                对话窗口备选模型列表 <span class="label-hint">每行一个模型 ID，使用相同接口与 Key</span>
              </label>
              <textarea id="models" name="models" rows="2" class="form-textarea font-mono" placeholder="例如 deepseek-v4-pro"></textarea>
            </div>

            <!-- 联网搜索工具 -->
            <div id="search-field" class="form-group pt-border">
              <label class="form-checkbox">
                <input id="web_search" name="web_search" type="checkbox">
                <span class="checkbox-label">发送 web_search 工具参数</span>
              </label>
            </div>
          </div>
        </section>

        <!-- 模块 3：提示词 Prompt -->
        <details class="card prompt-card" open>
          <summary class="prompt-summary">
            <div class="card-header-title">
              <h2>系统提示词 (System Prompt)</h2>
              <span class="card-header-desc">AI 角色设定、输出规范与 LaTeX 规则</span>
            </div>
            <button type="button" id="reset-prompt" class="btn btn-secondary btn-xs" title="一键重置为内置的标准提示词">
              恢复默认提示词
            </button>
          </summary>

          <div class="card-body prompt-body">
            <textarea id="prompt" name="prompt" rows="8" spellcheck="false" class="form-textarea prompt-textarea font-mono" aria-label="系统提示词"></textarea>
          </div>
        </details>

      </form>
    </main>
  </div>
</body>
</html>
