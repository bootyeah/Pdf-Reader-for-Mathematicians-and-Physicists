<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>airtex · 手写公式</title>
<!--AIRTEX_BOOT-->
<style>
  :root{
    --bg:#111318; --panel:#1a1d24; --line:#2b303a; --fg:#e8eaee;
    --dim:#8b93a1; --accent:#4c8dff; --ok:#37b26c; --warn:#e0a23c;
    --danger:#e0554b; --radius:14px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei UI",sans-serif;
    overscroll-behavior:none;touch-action:manipulation}
  #app{display:flex;flex-direction:column;position:relative;height:100%;height:100dvh;
    padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)}
  header{display:flex;align-items:center;gap:8px;padding:8px 12px;
    font-size:13px;color:var(--dim);flex:none}
  #title{font-weight:600;color:var(--fg);letter-spacing:.3px}
  #dot{position:relative;width:8px;height:8px;min-height:8px;padding:0;border:0;
    background:transparent;flex:none;cursor:default}
  #dot:active{transform:none}
  #dot::before{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;
    transform:translate(-50%,-50%);border-radius:50%;background:var(--danger);
    transition:background .3s}
  #dot.on::before{background:var(--ok);box-shadow:0 0 8px rgba(55,178,108,.8)}
  #status{margin-left:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
  #viewBtn{flex:none;min-height:40px;padding:8px 12px;font-size:13px}
  #palmGuardBtn{flex:none;min-height:40px;padding:8px 10px;font-size:13px}
  #palmGuardBtn svg{display:none}
  #stage{flex:1;position:relative;min-height:0;margin:0 8px;
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    background:#fff;touch-action:none}
  #board{position:absolute;inset:0;width:100%;height:100%;display:block;
    touch-action:none;cursor:crosshair}
  #canvasView{position:absolute;left:10px;bottom:10px;z-index:7;display:flex;align-items:center;gap:8px;
    color:#64748b;font-size:12px;font-variant-numeric:tabular-nums}
  #resetViewBtn{flex:none;min-height:40px;padding:8px 10px;font-size:12px;
    background:rgba(26,29,36,.88)}
  #app.writing-fullscreen #fullscreenSelectBtn{position:absolute;left:calc(6px + var(--safe-l));
    top:calc(6px + var(--safe-t));z-index:10}
  #app.writing-fullscreen.tools-collapsed #fullscreenSelectBtn,
  #app.writing-fullscreen.tools-collapsed #canvasView{display:none}
  #selectionModes{position:absolute;left:10px;top:10px;z-index:10;display:flex;gap:4px;
    padding:3px;border:1px solid var(--line);border-radius:12px;background:rgba(26,29,36,.92)}
  #selectionModes[hidden]{display:none}
  #selectionModes button{flex:none;min-height:40px;padding:8px 12px;font-size:13px}
  #app.writing-fullscreen #selectionModes{left:calc(6px + var(--safe-l));top:calc(58px + var(--safe-t))}
  #app.writing-fullscreen.tools-collapsed #selectionModes{display:none}
  @media (max-width:380px){
    .tools{gap:4px}.tools button.ghost{min-width:44px;padding:10px 6px;font-size:13px}
    #app.writing-fullscreen header{gap:4px}
    #app.writing-fullscreen #viewBtn{width:62px;min-height:44px;padding:4px;font-size:12px}
  }
  #hint{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:#bcc2cc;font-size:15px;pointer-events:none;
    transition:opacity .25s;text-align:center;padding:0 24px;line-height:1.6}
  #hint.hide{opacity:0}
  /* 电脑端切到「鼠标手写」时本页暂停：盖上遮罩，避免两边抢同一块画布 */
  #lock{position:absolute;inset:0;display:none;align-items:center;
    justify-content:center;text-align:center;padding:24px;line-height:1.75;
    font-size:14px;color:#e8eaee;background:rgba(15,17,22,.94);z-index:6}
  #lock.show{display:flex}
  #lock b{font-size:16px;display:block;margin-bottom:8px}
  #lock .tip{color:var(--dim);font-size:13px;margin-top:10px}
  #busy{position:absolute;left:0;right:0;top:0;padding:6px 10px;font-size:12px;
    color:#fff;background:rgba(76,141,255,.92);display:none;align-items:center;
    gap:8px}
  #busy.show{display:flex}
  .spin{width:12px;height:12px;border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  #err{flex:none;margin:8px 8px 0;padding:8px 12px;border-radius:var(--radius);
    background:rgba(224,85,75,.14);border:1px solid rgba(224,85,75,.5);
    color:#ffb3ad;font-size:13px;display:none}
  #err.show{display:block}
  footer{flex:none;padding:10px 8px 8px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px}
  button{flex:1;appearance:none;border:1px solid var(--line);background:var(--panel);
    color:var(--fg);border-radius:12px;padding:13px 10px;font-size:15px;
    font-weight:600;min-height:48px;transition:transform .06s,background .15s}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.4}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:disabled{background:#33415c;border-color:#33415c}
  button.ghost{flex:0 0 auto;min-width:64px;font-weight:500;font-size:14px}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tools{display:flex;gap:8px;align-items:center}
  .tools label{font-size:12px;color:var(--dim);display:flex;align-items:center;
    gap:6px}
  #width{flex:1;min-width:32px;width:60px;accent-color:var(--accent)}
  #colorPalette{display:flex;flex:none;justify-content:center;gap:4px;margin:6px 8px 0;
    padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--panel);z-index:10}
  #colorPalette button{flex:none;width:40px;height:40px;min-height:40px;padding:8px;
    display:grid;place-items:center;background:transparent;border-color:transparent}
  #colorPalette button::before{content:"";width:22px;height:22px;border-radius:50%;
    background:var(--pen-color);border:1px solid rgba(255,255,255,.5)}
  #colorPalette button[aria-pressed="true"]{border-color:var(--fg);background:rgba(255,255,255,.1)}
  #colorPalette button[aria-pressed="true"]::before{box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--fg)}
  #toast{position:fixed;left:50%;bottom:calc(18px + var(--safe-b));
    transform:translateX(-50%) translateY(20px);background:rgba(20,22,28,.96);
    color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;
    border:1px solid var(--line);opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;z-index:20;white-space:nowrap;
    max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  details{font-size:13px;color:var(--dim);padding:0 4px}
  details summary{cursor:pointer;padding:4px 0}
  code{font-family:ui-monospace,Menlo,Consolas,monospace;color:#cfd6e4;
    word-break:break-all}
  #pageNav{display:flex;align-items:center;gap:6px;flex:none;align-self:flex-end;
    margin:6px 8px 0;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--panel);z-index:10}
  #pageNav[hidden]{display:none}
  #pageNav button{flex:none;width:44px;min-height:44px;padding:8px;font-size:20px}
  #pageNumber{min-width:58px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}
  #app.writing-fullscreen #pageNav{position:absolute;right:calc(8px + var(--safe-r));
    bottom:calc(8px + var(--safe-b));margin:0;background:rgba(26,29,36,.88)}
  #app.whiteboard-pages.writing-fullscreen #err{bottom:calc(64px + var(--safe-b))}
  /* 横屏工具压成一行；报错悬浮显示，避免把画板挤矮。 */
  @media (orientation:landscape){
    #colorPalette{position:absolute;right:calc(8px + var(--safe-r));top:calc(54px + var(--safe-t));margin:0;
      background:rgba(26,29,36,.88)}
    header{padding:4px 8px}
    footer{flex-direction:row;align-items:center;padding:6px 8px;gap:8px}
    .tools{flex:1;min-width:0;gap:6px}
    #width{min-width:36px;width:60px;max-width:140px}
    footer > .row{flex:none}
    footer button{min-height:44px;padding:9px 10px;font-size:14px}
    footer button.ghost{min-width:54px}
    #fallbackBox{position:absolute;top:calc(52px + var(--safe-t));
      right:calc(12px + var(--safe-r));z-index:8;max-width:calc(100% - 24px);
      padding:4px 8px;border-radius:8px;background:var(--panel)}
    #fallbackBox:not([open]){font-size:12px;opacity:.85}
    #err{position:absolute;left:var(--safe-l);right:var(--safe-r);
      bottom:calc(64px + var(--safe-b));z-index:7;max-height:55%;overflow:auto}
  }
  /* 全屏保留防误触、橡皮和清空入口，其余工具由「显示工具」展开。 */
  .fullscreen-tool{display:none;flex:none;width:44px;min-height:44px;padding:10px}
  .fullscreen-tool svg,#palmGuardBtn svg{width:22px;height:22px;fill:none;
    stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .fullscreen-tool svg{display:block}
  #app.writing-fullscreen #palmGuardBtn{width:44px;min-height:44px;padding:10px;
    background:rgba(26,29,36,.88)}
  #app.writing-fullscreen #palmGuardBtn span{display:none}
  #app.writing-fullscreen #palmGuardBtn svg{display:block}
  #app.writing-fullscreen #palmGuardBtn.on{background:var(--accent);border-color:var(--accent)}
  #app.writing-fullscreen .fullscreen-tool{display:block;background:rgba(26,29,36,.88)}
  #app.writing-fullscreen .fullscreen-tool.on{background:var(--accent);border-color:var(--accent)}
  #app.writing-fullscreen #stage{margin:0;border:0;border-radius:0}
  #app.writing-fullscreen header{position:absolute;top:calc(6px + var(--safe-t));
    right:calc(6px + var(--safe-r));padding:0;z-index:10;gap:6px}
  #app.writing-fullscreen header #title,#app.writing-fullscreen header #status,
  #app.writing-fullscreen footer{display:none}
  #app.writing-fullscreen #dot{width:44px;height:44px;min-height:44px;cursor:pointer}
  #app.writing-fullscreen #dot::before{box-shadow:0 0 0 3px rgba(26,29,36,.8)}
  #app.writing-fullscreen header.tools-collapsed > :not(#dot){display:none}
  #app.writing-fullscreen.tools-collapsed #pageNav{display:none}
  #app.writing-fullscreen #colorPalette{position:absolute;left:auto;right:calc(6px + var(--safe-r));
    top:calc(58px + var(--safe-t));margin:0;gap:2px;padding:3px;flex-direction:column;justify-content:flex-start;
    max-height:calc(100% - 74px - var(--safe-t) - var(--safe-b));overflow-y:auto;
    background:rgba(26,29,36,.88)}
  #app.whiteboard-pages.writing-fullscreen #colorPalette{max-height:calc(100% - 126px - var(--safe-t) - var(--safe-b))}
  #app.writing-fullscreen.tools-collapsed #colorPalette{display:none}
  #app.writing-fullscreen #viewBtn{background:rgba(26,29,36,.88)}
  #app.writing-fullscreen #err{
    position:absolute;left:var(--safe-l);right:var(--safe-r);
    bottom:calc(8px + var(--safe-b));z-index:7;max-height:55%;overflow:auto}

  /* 全屏模式下的快速识别与撤销按钮排版 */
  #fullscreenUndoBtn svg{width:22px;height:22px}
  #app.writing-fullscreen #fullscreenUndoBtn{display:none}
  #fullscreenRecognizeBtn,
  #app.writing-fullscreen #fullscreenRecognizeBtn{
    display:none;
    align-items:center;
    justify-content:center;
    width:auto;
    min-width:88px;
    height:44px;
    min-height:44px;
    padding:0 16px;
    background:var(--accent);
    border:1px solid var(--accent);
    color:#fff;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    flex:none;
    box-shadow:0 2px 8px rgba(76,141,255,.3);
    transition:background .15s,transform .06s,opacity .15s;
    line-height:1;
    white-space:nowrap;
  }
  #fullscreenRecognizeBtn:active{
    transform:scale(.96);
  }
  #fullscreenRecognizeBtn svg{
    display:none;
  }
  #fullscreenRecognizeBtn .fullscreen-recog-text{
    display:inline;
    font-size:14px;
    font-weight:600;
    line-height:1;
    color:#fff;
    white-space:nowrap;
  }
  #fullscreenRecognizeBtn:disabled{
    background:#252e42;
    border-color:#2b354c;
    color:#7e8b9f;
    opacity:.55;
    box-shadow:none;
    cursor:not-allowed;
  }
  #fullscreenRecognizeBtn:disabled .fullscreen-recog-text{
    color:#7e8b9f;
  }
  #fullscreenRecognizeBtn.busy{
    opacity:.85;
    cursor:wait;
  }
  #app.writing-fullscreen.tools-collapsed #fullscreenUndoBtn,
  #app.writing-fullscreen.tools-collapsed #fullscreenRecognizeBtn{display:none}

  /* 平板 / iPad 专属深度排版适配 (>= 640px 且高 >= 500px，避免手机横屏误命中) */
  @media (min-width: 640px) and (min-height: 500px) {
    header{padding:10px 16px;gap:12px;font-size:14px}
    #title{font-size:15px;letter-spacing:.4px}
    #status{font-size:13px;max-width:320px}
    #viewBtn{min-height:42px;padding:8px 16px;font-size:14px;border-radius:12px}
    #palmGuardBtn{min-height:42px;padding:8px 14px;font-size:14px;border-radius:12px}
    #stage{margin:0 12px;border-radius:16px}
    #colorPalette{margin:8px 12px 0;padding:6px;gap:8px}
    #colorPalette button{width:44px;height:44px;min-height:44px}
    #colorPalette button::before{width:24px;height:24px}
    footer{padding:12px 16px 14px;gap:12px}
    .tools{justify-content:center;gap:10px;width:100%;max-width:760px;margin:0 auto}
    .tools button.ghost{min-width:72px;padding:10px 14px;font-size:14px;min-height:44px}
    .tools #width{width:80px}
    footer > .row{justify-content:center}
    #recognizeBtn{max-width:280px;width:100%;font-size:16px;min-height:50px;border-radius:14px}
    #fallbackBox{max-width:640px;margin:0 auto;width:100%}

    /* 平板全屏下开放撤销与识别按钮 */
    #app.writing-fullscreen #fullscreenUndoBtn{display:block;background:rgba(26,29,36,.88)}
    #app.writing-fullscreen #fullscreenRecognizeBtn{display:inline-flex}

    #app.writing-fullscreen header{
      top:calc(10px + var(--safe-t));right:calc(12px + var(--safe-r));
      gap:8px;padding:4px 8px;
      align-items:center;
      background:rgba(26,29,36,.92);border:1px solid var(--line);
      border-radius:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      box-shadow:0 4px 20px rgba(0,0,0,.35);
    }
    #app.writing-fullscreen #viewBtn{
      min-height:44px;height:44px;padding:0 14px;font-size:13px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
    }
    #app.writing-fullscreen #palmGuardBtn{
      display:flex;align-items:center;gap:6px;padding:0 12px;
      font-size:13px;width:auto;min-width:44px;
    }
    #app.writing-fullscreen #palmGuardBtn span{display:inline}
    #app.writing-fullscreen #palmGuardBtn svg{display:block;width:18px;height:18px}
    #app.writing-fullscreen #colorPalette{
      top:calc(70px + var(--safe-t));right:calc(12px + var(--safe-r));
      padding:5px;gap:4px;border-radius:14px;
      box-shadow:0 4px 20px rgba(0,0,0,.35);
    }
    #app.writing-fullscreen #fullscreenSelectBtn{
      left:calc(12px + var(--safe-l));top:calc(10px + var(--safe-t));
      border-radius:14px;min-height:44px;width:44px;
      box-shadow:0 4px 20px rgba(0,0,0,.35);
    }
    #app.writing-fullscreen #selectionModes{
      left:calc(62px + var(--safe-l));top:calc(10px + var(--safe-t));
      box-shadow:0 4px 20px rgba(0,0,0,.35);
    }
    #app.writing-fullscreen #pageNav{
      right:calc(12px + var(--safe-r));bottom:calc(12px + var(--safe-b));
      box-shadow:0 4px 20px rgba(0,0,0,.35);
    }
    #app.writing-fullscreen #canvasView{
      left:calc(12px + var(--safe-l));bottom:calc(12px + var(--safe-b));
    }
  }

  /* 平板横屏专属排版 (高 >= 500px 确保仅对平板/桌面生效，不影响手机横屏) */
  @media (min-width: 640px) and (min-height: 500px) and (orientation: landscape) {
    header{padding:8px 16px}
    #stage{margin:0 12px}
    footer{flex-direction:row;align-items:center;justify-content:space-between;padding:8px 16px;gap:16px}
    .tools{flex:1;justify-content:flex-start;max-width:none;margin:0}
    .tools #width{width:80px;max-width:120px}
    footer > .row{flex:none;margin:0}
    #recognizeBtn{width:auto;min-width:180px;max-width:220px;min-height:46px;font-size:15px}
    #colorPalette{position:absolute;right:calc(12px + var(--safe-r));top:calc(58px + var(--safe-t));margin:0;flex-direction:column}
    #fallbackBox{position:static;max-width:320px;margin:0}
  }

  /* iPad 全局文本选区与系统长按菜单禁用，保障 Apple Pencil 纯粹手写 */
  .is-ipad body, .is-ipad #stage, .is-ipad #board, .is-ipad #palmRest, .is-ipad #palmRestArea, .is-ipad .palm-rest-divider{
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    user-select:none;
  }

  /* iPad 及手机全屏横屏专属防误触掌托垫板 (可上下拖动直线，其下区域无法书写且手掌不误触) */
  #palmRest{
    position:absolute;left:0;right:0;bottom:0;
    height:0;z-index:6;pointer-events:none;display:block;
  }
  #palmRest[hidden]{display:none !important}
  .palm-rest-divider{
    position:absolute;left:0;right:0;top:0;height:36px;margin-top:-18px;
    display:flex;align-items:center;justify-content:center;
    cursor:ns-resize;touch-action:none;pointer-events:auto;z-index:2;
    -webkit-user-select:none;user-select:none;
  }
  .palm-rest-line{
    position:absolute;left:0;right:0;top:50%;height:1px;
    background:rgba(148,163,184,.38);pointer-events:none;
    transition:background .2s;
  }
  .palm-rest-handle{
    position:relative;z-index:1;padding:6px 14px;pointer-events:none;
  }
  .palm-rest-pill{
    width:40px;height:4px;border-radius:999px;
    background:rgba(148,163,184,.5);
    box-shadow:0 1px 2px rgba(0,0,0,.04);
    transition:background .2s,transform .2s;
  }
  .palm-rest-divider:active .palm-rest-line,
  .palm-rest-divider.dragging .palm-rest-line{
    background:rgba(99,102,241,.55);
  }
  .palm-rest-divider:active .palm-rest-pill,
  .palm-rest-divider.dragging .palm-rest-pill{
    background:rgba(99,102,241,.85);
    transform:scaleY(1.25);
  }
  .palm-rest-area{
    position:absolute;left:0;right:0;top:0;bottom:0;
    background:rgba(248,250,252,.46);
    backdrop-filter:blur(0.5px);-webkit-backdrop-filter:blur(0.5px);
    touch-action:none;pointer-events:auto;z-index:1;
    cursor:default;
  }
  #palmRest.docked .palm-rest-divider{
    top:auto;bottom:0;margin-top:0;margin-bottom:-10px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="dot" type="button" tabindex="-1" aria-label="连接中…" title="连接中…"></button>
    <span id="title">airtex</span>
    <span id="status">连接中…</span>
    <button id="palmGuardBtn" type="button" aria-label="辅助防误触" title="辅助防误触：减少大面积触碰和多指误写，无法完全区分普通电容笔与手指" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 7v5c0 5 9 9 9 9s9-4 9-9V7Z"/><path d="m8 12 3 3 5-6"/></svg><span>防误触</span>
    </button>
    <button id="fullscreenEraserBtn" class="fullscreen-tool" type="button" aria-label="擦笔画" title="擦笔画" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 3 7 7-11 11H6l-4-4Z"/><path d="m7 12 7 7M10 21h12"/></svg>
    </button>

<div id="toast"></div>

<script>
(function () {
  "use strict";

               (typeof location !== "undefined" && location.search && location.search.indexOf("ipad=1") !== -1) ||
               (typeof document !== "undefined" && document.documentElement && document.documentElement.classList.contains("is-ipad"));
  var isIOS = isIPad || /iPhone|iPod/i.test(navigator.userAgent);
  var isTablet = isIPad || (Math.min(window.screen.width, window.screen.height) >= 600 && (navigator.maxTouchPoints > 0 || 'ontouchstart' in window));

  if (isTablet) document.documentElement.classList.add("is-tablet");

  // 每个页面实例一个客户端 id：服务端据此不回推自己写入的内容，
  // 避免手机收到自己上一帧的旧内容（或空内容）而把画布清掉。
  var CLIENT_ID = (function () {
    try {
      var k = "airtex_client_id";
      var v = sessionStorage.getItem(k);
      if (!v) {
        v = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        sessionStorage.setItem(k, v);
      }
      return v;
    } catch (e) {
      return "c" + Date.now().toString(36);
    }
  })();

  var canvas = $("board"), ctx = canvas.getContext("2d");
  var stage = $("stage");
  var landscape = window.matchMedia("(orientation: landscape)");
  var writingFullscreen = false, resizeFrame = 0, toolsCollapsed = false;
  var userToggledFullscreen = false;

  function updateToolsToggle() {
    $("dot").parentElement.classList.toggle("tools-collapsed", toolsCollapsed);
    $("app").classList.toggle("tools-collapsed", toolsCollapsed);
    var label = $("status").textContent;
    if (writingFullscreen) {
      label += toolsCollapsed ? "，点击展开工具和颜色板" : "，点击收起工具和颜色板";
      $("dot").setAttribute("aria-expanded", String(!toolsCollapsed));
      $("dot").tabIndex = 0;
    } else {
      $("dot").removeAttribute("aria-expanded");
      $("dot").tabIndex = -1;
    }
    $("dot").title = label;
    $("dot").setAttribute("aria-label", label);
  }
  $("dot").onclick = function () {
    if (!writingFullscreen) return;
    toolsCollapsed = !toolsCollapsed;
    updateToolsToggle();
  };

  function scheduleFit() {
    if (resizeFrame) return;
    resizeFrame = requestAnimationFrame(function () {
      resizeFrame = 0;
      fitCanvas();
    });
  }

  function updateViewBtnLabel() {
    var label;
    if (writingFullscreen) {
      label = isTablet ? "退出全屏" : "显示工具";
    } else {
      label = "全屏书写";
    }
    $("viewBtn").textContent = label;
    $("viewBtn").setAttribute("aria-pressed", String(writingFullscreen));
    $("viewBtn").title = writingFullscreen ? (isTablet ? "退出全屏书写模式" : "显示撤销、橡皮和识别按钮") : "收起工具，全屏书写";
  }

  function setWritingFullscreen(on) {
    writingFullscreen = on;
    $("app").classList.toggle("writing-fullscreen", on);
    updateViewBtnLabel();
    updateToolsToggle();
    // 手机进出全屏横屏时同步显示/隐藏掌托垫板
    if (typeof updatePalmRestLayout === "function") updatePalmRestLayout();
    scheduleFit();
  }

  $("viewBtn").onclick = function () {
    userToggledFullscreen = true;
    setWritingFullscreen(!writingFullscreen);
    // iPad / iOS 上严禁调用原生 requestFullscreen()！
    // 原因是 iPadOS Safari 原生全屏会触发系统“向下轻扫退出全屏”悬浮提示和手势拦截，
    // 用户拿笔向下书写竖笔画或靠近顶部时会被系统判定为轻扫误退出。
    // 使用纯净的页面级沉浸全屏（已填满 100dvh），完全免疫手势误退，手写不受打断。
    if (!isIPad && !isIOS) {
      if (writingFullscreen && !document.fullscreenElement && document.documentElement.requestFullscreen) {
        try {
          var request = document.documentElement.requestFullscreen();
          if (request && request.catch) request.catch(function () {});
        } catch (e) {}
      } else if (!writingFullscreen && document.fullscreenElement && document.exitFullscreen) {
        var exit = document.exitFullscreen();
        if (exit && exit.catch) exit.catch(function () {});
      }
    }
  };
  document.addEventListener("fullscreenchange", function () {
    if (!isIPad && !isIOS && !document.fullscreenElement) setWritingFullscreen(false);
    scheduleFit();
  });

  // ---------- 文档模型 ----------
  var doc = { w: 1000, h: 700, infinite: true, strokes: [] };
  var redo = [], undo = [];
  // 视角只存手机本地；笔迹始终用不受屏幕尺寸限制的世界坐标。
  var view = { x: 0, y: 0, scale: 0 };
  var pagesEnabled = !!window.AIRTEX_PARAGRAPH, pages = [], pageIndex = 0;
  var notebookDb = null, pagesReady = false, restoredPages = false, notebookSaveError = false;
  var notebookKey = TOKEN || "default", pendingRecognition = "";

  function newPage() {
    return { id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2),
      doc: { w: doc.w, h: doc.h, infinite: true, strokes: [] }, redo: [], undo: [],
      view: { x: 0, y: 0, scale: view.scale } };
  }
  function currentPageId() { return pagesEnabled && pages[pageIndex] ? pages[pageIndex].id : ""; }
  function storageError() {
    if (!notebookSaveError) toast("手机本地保存不可用，关闭页面前请保留草稿");
    notebookSaveError = true;
  }
  function readNotebook(store, key) {
    return new Promise(function (resolve, reject) {
      var request = notebookDb.transaction(store).objectStore(store).get(key);
      request.onsuccess = function () { resolve(request.result); };
      request.onerror = function () { reject(request.error); };
    });
  }
  async function initializePages() {
    if (!pagesEnabled) return;
    $("app").classList.add("whiteboard-pages");
    try {
      notebookDb = await new Promise(function (resolve, reject) {
        var request = indexedDB.open("airtex-whiteboard-notebooks", 1);
        request.onupgradeneeded = function () {
          request.result.createObjectStore("books"); request.result.createObjectStore("pages");
        };
        request.onsuccess = function () { resolve(request.result); };
        request.onerror = request.onblocked = function () { reject(request.error); };
      });
      var book = await readNotebook("books", notebookKey);
      if (book && Array.isArray(book.ids) && book.ids.length) {
        var stored = await Promise.all(book.ids.map(function (id) { return readNotebook("pages", notebookKey + ":" + id); }));
        if (stored.every(function (p) { return p && p.id && p.doc && p.doc.w > 0 && p.doc.h > 0 && Array.isArray(p.doc.strokes); })) {
          pages = stored; pageIndex = Math.max(0, Math.min(book.index || 0, pages.length - 1)); restoredPages = true;
          serverCleared = book.clearedSeq || 0;
        }
      }
    } catch (e) { storageError(); }
    if (!pages.length) pages = [newPage()];
    doc = pages[pageIndex].doc; redo = pages[pageIndex].redo || [];
    undo = pages[pageIndex].undo || penHistory();
    view = pages[pageIndex].view || { x: 0, y: 0, scale: 0 };
    pagesReady = true; $("pageNav").hidden = false; updatePages();
  }
  function saveLocalPage() {
    if (!pagesEnabled || !pagesReady) return;
    pages[pageIndex].doc = doc; pages[pageIndex].redo = redo;
    pages[pageIndex].undo = undo; pages[pageIndex].view = view;
    if (!notebookDb) return;
    try {
      var tx = notebookDb.transaction(["books", "pages"], "readwrite");
      tx.objectStore("pages").put({ id: currentPageId(), doc: compactDoc(), redo: redo, undo: undo, view: view }, notebookKey + ":" + currentPageId());
      tx.objectStore("books").put({ ids: pages.map(function (p) { return p.id; }), index: pageIndex, clearedSeq: serverCleared }, notebookKey);
      tx.onerror = tx.onabort = storageError;
    } catch (e) { storageError(); }
  }
  function updatePages() {
    if (!pagesEnabled) return;
    $("pageNumber").textContent = (pageIndex + 1) + " / " + pages.length;
    $("prevPageBtn").disabled = !pagesReady || locked() || pageIndex === 0;
    $("nextPageBtn").disabled = !pagesReady || locked();
    $("nextPageBtn").title = pageIndex === pages.length - 1 ? "新建下一页" : "下一页";
  }
  function turnPage(step) {
    if (!pagesEnabled || !pagesReady || locked() || pageIndex + step < 0) return;
    var heldTouch = touchActive || pageTouchBlocked;
    onUp({ type: "touchcancel", cancelable: false }); saveLocalPage();
    if (pageIndex + step === pages.length) pages.push(newPage());
    pageIndex += step;
    doc = pages[pageIndex].doc; redo = pages[pageIndex].redo || [];
    undo = pages[pageIndex].undo || penHistory();
    view = pages[pageIndex].view || { x: 0, y: 0, scale: 0 };
    selection = null; selectionDrag = null; navigation = null; navigating = false;
    drawing = null; lastPt = null; activeTouchId = null; activeTouchIsStylus = false; guardMouseDown = false;
    pageTouchBlocked = heldTouch;

  }
  $("prevPageBtn").onclick = function () { turnPage(-1); };
  $("nextPageBtn").onclick = function () { turnPage(1); };
  var dirty = false;        // 本地有未同步的修改
  var sending = false;
  var sending2 = false;

  // 电脑端当前的输入模式：phone=手机手写（本页可写）；pc=鼠标手写（本页暂停）。
  // 两种模式在电脑上是两块不同的画布，所以这里必须真的停下来，
  // 否则手机一笔就会把电脑鼠标写的内容覆盖掉。
  var mode = "phone";
  function locked() { return mode === "pc"; }

  var penWidth = 3;
  var eraser = false;
  var selecting = false, selection = null, selectionDrag = null;
  var selectionMode = "lasso";
  try { if (localStorage.getItem("airtex_selection_mode") === "rect") selectionMode = "rect"; } catch (e) {}
  var eraseUndo = [], inputDown = false;
  var drawing = null;       // 当前正在画的笔迹
  var erased = false;       // 本次擦除动作是否删掉过东西
  var penColor = "#111111";
  var colorButtons = Array.from($("colorPalette").querySelectorAll("button"));
  try {
    var savedColor = localStorage.getItem("airtex_pen_color");
    if (colorButtons.some(function (button) { return button.dataset.color === savedColor; })) penColor = savedColor;
  } catch (e) {}
  function updateColorButtons() {
    colorButtons.forEach(function (button) {
      button.setAttribute("aria-pressed", String(button.dataset.color === penColor));
    });
  }
  updateColorButtons();
  colorButtons.forEach(function (button) {
    button.onclick = function () {
      onUp({ type: "touchcancel", cancelable: false });
      penColor = button.dataset.color;
      eraser = false;
      selecting = false; selection = null;
      updateEraserButtons();
      updateSelectionButtons(); redraw();
      updateColorButtons();
      try { localStorage.setItem("airtex_pen_color", penColor); } catch (e) {}
    };
  });

  // ---------- 笔画橡皮：点/划到哪一笔就整笔删掉 ----------
  // 点到线段的距离平方
  function segDist2(px, py, ax, ay, bx, by) {
    var dx = bx - ax, dy = by - ay;
    var len2 = dx * dx + dy * dy;
    var t = len2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    var qx = ax + t * dx, qy = ay + t * dy;
    return (px - qx) * (px - qx) + (py - qy) * (py - qy);
  }

  function strokeHit(s, x, y, tol) {
    var p = s.p, i;
    var t2 = tol * tol;
    if (p.length === 1) {
      var dx = x - p[0][0], dy = y - p[0][1];
      return dx * dx + dy * dy <= t2;
    }
    for (i = 1; i < p.length; i++) {
      if (segDist2(x, y, p[i - 1][0], p[i - 1][1], p[i][0], p[i][1]) <= t2) {
        return true;
      }
    }
    return false;
  }

  // 返回本次是否删除了笔画
  function eraseAt(x, y) {
    // 容差跟着笔宽走，手指touch更宽容一点
    var base = Math.max(16, (penWidth + 4) * 5) * dpr / scale;
    var removed = false;
    for (var i = doc.strokes.length - 1; i >= 0; i--) {
      var s = doc.strokes[i];
      var tol = base + (s.w || 3);
      if (strokeHit(s, x, y, tol)) {
        eraseUndo.push({ index: i, stroke: s });
        doc.strokes.splice(i, 1);
        removed = true;
        break;                 // 一次只擦一笔，避免划一下全没了
      }
    }
    return removed;
  }

  // ---------- 画布尺寸 ----------
  var dpr = 1, cssW = 0, cssH = 0;
  var scale = 1, offX = 0, offY = 0;

  // w/h 仅表示初始视野；旋转、全屏、缩放都不再改写已有笔迹。
  function fitDocToCanvas() {
    if (!view.scale) {
      if (!doc.strokes.length) {
        var unit = 1000 / Math.min(cssW, cssH);
        doc.w = Math.round(cssW * unit); doc.h = Math.round(cssH * unit);
      }
      view.scale = Math.min(cssW / doc.w, cssH / doc.h);
      view.x = (doc.w - cssW / view.scale) / 2;
      view.y = (doc.h - cssH / view.scale) / 2;
    }
    if (!doc.infinite) {
      doc.infinite = true;
      if (doc.strokes.length) { dirty = true; queueSync(); }
    }
  }

  // 文档坐标 <-> 画布像素 的映射（画板居中；比例一致时 offX/offY 就是 0）
  function relayout() {
    scale = view.scale * dpr;
    offX = -view.x * scale; offY = -view.y * scale;
    $("zoomLevel").textContent = Math.round(view.scale / Math.min(cssW / doc.w, cssH / doc.h) * 100) + "%";
  }

  function fitCanvas() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    var nextDpr = Math.min(window.devicePixelRatio || 1, 2.5);
    if (w === cssW && h === cssH && dpr === nextDpr) return;
    // 尺寸变化发生在落笔期间时先收笔，避免新旧坐标连接成一条斜线。
    if (inputDown || navigation) onUp({ type: "touchcancel", cancelable: false });
    var center = view.scale && cssW ? [view.x + cssW / view.scale / 2, view.y + cssH / view.scale / 2] : null;
    cssW = w; cssH = h; dpr = nextDpr;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    fitDocToCanvas();
    if (center) { view.x = center[0] - cssW / view.scale / 2; view.y = center[1] - cssH / view.scale / 2; }
    relayout();
    if (typeof updatePalmRestLayout === "function") updatePalmRestLayout();
    redraw();
    saveLocalPage();
  }

  function toDoc(clientX, clientY) {
    var r = canvas.getBoundingClientRect();
    var x = ((clientX - r.left) * dpr - offX) / scale;
    var y = ((clientY - r.top) * dpr - offY) / scale;
    return [x, y];
  }

  // ---------- 绘制 ----------
  function strokePath(s) {
    var p = s.p;
    if (p.length === 0) return;
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = Math.max(1, s.w * scale);
    ctx.strokeStyle = ctx.fillStyle = s.k === "eraser" ? "#ffffff" : (s.c || "#111111");
    if (p.length === 1) {
      var r = ctx.lineWidth / 2;
      ctx.beginPath();

  }

  function syncNow() {
    if (locked()) return;        // 暂停期间不发数据（本地修改留在 dirty 里）
    if (sending) { sending2 = true; return; }
    if (!dirty) return;
    sending = true;
    var sentVersion = editVersion;
    // 写入使用串行 HTTP 确认，WebSocket 只负责状态推送。send() 成功不代表服务端收到。
    var payload = { rev: serverRev, doc: compactDoc(), clearedSeq: serverCleared, client: CLIENT_ID, updateId: sentVersion };
    if (pagesEnabled) payload.pageId = currentPageId();
    api("/api/update", payload, function (status, data) {
      sending = false;
      if (status === 200 && data && data.ok) {
        syncError = '';
        if (typeof data.rev === "number") serverRev = data.rev;
        if (data.accepted !== false && sentVersion === editVersion) dirty = false;
        if (data.accepted === false) handleMessage(Object.assign({ type: 'state' }, data));
        if (!dirty && pendingRecognition === currentPageId() && pendingRecognition) {
          pendingRecognition = ""; requestRecognition();
        }
        setStatus(locked() ? "电脑鼠标手写中" : dirty ? "正在同步…" : "已同步", true);
      } else {
        syncError = data && data.error ? data.error : "连接中断，笔迹保留，正在重试…";
        setStatus(syncError, false);
      }
      var again = sending2; sending2 = false;
      if (again && status === 200 && dirty) syncNow();
    });
  }

  function poll() {
    if (polling) return;
    polling = true;
    api("/api/state?rev=" + serverRev, null, function (status, data) {
      polling = false;
      if (status === 200 && data) {
        handleMessage(Object.assign({ type: "state" }, data));
      } else if (status === 0) {
        setStatus("未连接", false);
      }
    });
  }

  // ---------- UI 状态 ----------
  function setStatus(text, online) {
    if (dirty && !locked() && !busy) { text = syncError || '正在同步…'; online = !syncError && online; }
    $("status").textContent = text;
    $("dot").className = online ? "on" : "";
    updateToolsToggle();
  }

  function setBusy(on) {
    busy = on;
    $("busy").className = on ? "show" : "";
    $("recognizeBtn").textContent = on ? "识别中…" : window.AIRTEX_PARAGRAPH ? "识别段落" : "识别公式";
    if ($("fullscreenRecognizeBtn")) {
      $("fullscreenRecognizeBtn").classList.toggle("busy", on);
      var fsTxt = $("fullscreenRecognizeBtn").querySelector(".fullscreen-recog-text");
      if (fsTxt) fsTxt.textContent = on ? "识别中…" : (window.AIRTEX_PARAGRAPH ? "识别段落" : "识别公式");
    }
    updateButtons();
  }

  var lastLatex = "";
  function applyResult(result, error, recognizedError) {
    if (pagesEnabled && result && result.pageId && result.pageId !== currentPageId()) return;
    if (result && result.latex && result.latex !== lastLatex) {
      // 仅供只读诊断；手机不创建结果面板，也不改写剪贴板。
      lastLatex = result.latex;
      $("err").className = "";
    }
    if (recognizedError) {
      $("err").textContent = recognizedError;
      $("err").className = "show";
    } else if (!error) {
      $("err").className = "";
    } else if (error && !result) {
      $("err").textContent = error;
      $("err").className = "show";
    }
  }

  var toastTimer = null;
  function toast(text) {
    var el = $("toast");
    el.textContent = text;
    el.className = "show";
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = ""; }, 1800);
  }

  // ---------- 按钮 ----------
  function requestRecognition() {
    setBusy(true);
    setStatus("识别中…", true);
    $("err").className = "";
    var body = { doc: compactDoc() };
    if (pagesEnabled) body.pageId = currentPageId();
    api("/api/recognize", body, function (status, data) {
        if (status !== 200 || (data && data.started === false && !data.recognizing)) {
          setBusy(false);
          toast("识别请求失败");
        }
    });
  }
  $("recognizeBtn").onclick = $("fullscreenRecognizeBtn").onclick = function () {
    if (busy || locked()) return;
    onUp({ type: "touchcancel", cancelable: false });
    if (!doc.strokes.length) return;
    if (pagesEnabled && dirty) { pendingRecognition = currentPageId(); updateButtons(); syncNow(); return; }
    requestRecognition();
  };

  $("undoBtn").onclick = $("fullscreenUndoBtn").onclick = function () {
    if (busy || locked() || (!doc.strokes.length && !undo.length)) return;
    onUp({ type: "touchcancel", cancelable: false });
    selection = null;
    var entry = undo.pop();
    if (!entry) { redo.push(doc.strokes.pop()); }
    else if (entry.kind === "add") redo.push(doc.strokes.splice(entry.index, 1)[0]);
    else if (entry.kind === "erase") {
      for (var i = entry.removed.length - 1; i >= 0; i--) doc.strokes.splice(entry.removed[i].index, 0, entry.removed[i].stroke);
    } else if (entry.kind === "move") {
      entry.indices.forEach(function (index) {
        doc.strokes[index].p = doc.strokes[index].p.map(function (p) { return [p[0] - entry.dx, p[1] - entry.dy]; });
      });
    }
    dirty = true;
    redraw();
    queueSync();
  };

  $("clearBtn").onclick = $("fullscreenClearBtn").onclick = function () {
    if (busy || locked()) return;
    if (!doc.strokes.length) return;
    if (!confirm("清空整幅手写内容？")) return;
    cancelPreview(); selection = null;
    pendingRecognition = "";
    doc.strokes = [];
    redo = [];
    undo = [];
    dirty = true;
    lastLatex = "";
    $("err").className = "";
    redraw();
    queueSync();
  };

  function updateEraserButtons() {
    $("eraserBtn").className = eraser ? "ghost on" : "ghost";
    $("eraserBtn").textContent = eraser ? "擦笔画 · 开" : "擦笔画";
    $("eraserBtn").setAttribute("aria-pressed", String(eraser));
    $("fullscreenEraserBtn").classList.toggle("on", eraser);
    $("fullscreenEraserBtn").setAttribute("aria-pressed", String(eraser));
    $("fullscreenEraserBtn").title = eraser ? "回到书写模式" : "擦笔画";
    $("fullscreenEraserBtn").setAttribute("aria-label", eraser ? "回到书写模式" : "擦笔画");
  }

  function toggleEraser(forceState, customToast) {
    if (locked()) return;
    onUp({ type: "touchcancel", cancelable: false });
    eraser = typeof forceState === "boolean" ? forceState : !eraser;
    selecting = false; selection = null; updateSelectionButtons(); redraw();
    updateEraserButtons();
    $("hint").textContent = eraser
      ? "擦笔画模式：点到哪一笔就整笔删掉，点「擦笔画」或按 E 回到书写"
      : (isIPad ? "支持 Apple Pencil 书写，点右上角「擦笔画」或按 E 切换橡皮" : "单指书写，两指缩放或移动画布\n电脑实时显示笔迹");
    toast(customToast || (eraser ? "🧹 已切换为橡皮擦模式" : "✏️ 已切换为画笔书写模式"));
  }

  $("eraserBtn").onclick = $("fullscreenEraserBtn").onclick = function () {
    toggleEraser();
  };

  // 快捷键支持（iPad 妙控键盘 / 蓝牙键盘 / 桌面浏览器）
  window.addEventListener("keydown", function (e) {
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    if ((e.metaKey || e.ctrlKey) && (e.key === "z" || e.key === "Z")) {
      e.preventDefault();
      if (writingFullscreen && $("fullscreenUndoBtn") && !$("fullscreenUndoBtn").disabled && getComputedStyle($("fullscreenUndoBtn")).display !== "none") {
        $("fullscreenUndoBtn").click();
      } else if ($("undoBtn") && !$("undoBtn").disabled) {
        $("undoBtn").click();
      }
      return;
    }
    if (e.key === "e" || e.key === "E") {
      e.preventDefault();
      toggleEraser();
      return;
    }
    if (e.key === "b" || e.key === "B" || e.key === "p" || e.key === "P") {
      e.preventDefault();
      toggleEraser(false);
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      if (writingFullscreen && $("fullscreenRecognizeBtn") && !$("fullscreenRecognizeBtn").disabled && getComputedStyle($("fullscreenRecognizeBtn")).display !== "none") {
        $("fullscreenRecognizeBtn").click();
      } else if ($("recognizeBtn") && !$("recognizeBtn").disabled) {
        $("recognizeBtn").click();
      }
      return;
    }
  });

  $("width").oninput = function () { penWidth = parseInt(this.value, 10) || 3; };

  $("connectBtn").onclick = function () {
    var v = ($("serverInput").value || "").trim();
    if (!v) return;
    if (!/^https?:\/\//i.test(v)) v = "http://" + v;
    location.href = v;
  };

  $("curUrl").textContent = location.href;

  // ---------- 启动 ----------
  // 暴露一个只读诊断入口，便于在手机浏览器控制台排查（不影响正常使用）
  window.__airtex = {
    get strokes() { return doc.strokes.length; },
    get rev() { return serverRev; },
    get session() { return serverSession; },
    get client() { return CLIENT_ID; },
    get size() { return [doc.w, doc.h]; },
    get connected() { return !!(ws && wsReady); },
    get busy() { return busy; },
    get latex() { return lastLatex; },
    get dirty() { return dirty; },
    get eraser() { return eraser; },
    get selecting() { return selecting; },
    get selectionMode() { return selectionMode; },
    get selection() { return selection ? selection.indices.length : 0; },
    get view() { return { x: view.x, y: view.y, scale: view.scale }; },
    get palmGuard() { return palmGuard; },
    get page() { return pagesEnabled ? pageIndex + 1 : 1; },
    get pages() { return pagesEnabled ? pages.length : 1; },
    get isStylus() { return activeTouchIsStylus; },
    get isIPad() { return isIPad; },
    get palmRest() {
      return {
        get visible() { return palmRestVisible; },
        get height() { return palmRestHeight; },
        get ratio() { return palmRestRatio; },
        isPointInPalmRest: isPointInPalmRest,
        setLayout: updatePalmRestLayout,
        setRatio: function (r) {
          palmRestRatio = Math.max(0, Math.min(0.85, r));
          updatePalmRestLayout();
        }
      };
    },
    get pageId() { return currentPageId(); },
    get mode() { return mode; },
    get locked() { return locked(); },
    clear: function () {
      cancelPreview(); selection = null; doc.strokes = []; undo = []; redo = [];
      dirty = true; redraw(); queueSync();
    }
  };

  async function init() {
    await initializePages();
    if (window.AIRTEX_PARAGRAPH) {
      document.title = '手写草稿白板';
      $("recognizeBtn").textContent = '识别段落';
      if ($("fullscreenRecognizeBtn")) {
        $("fullscreenRecognizeBtn").setAttribute("aria-label", "识别段落");
        $("fullscreenRecognizeBtn").title = "识别段落";
        var fsInitTxt = $("fullscreenRecognizeBtn").querySelector(".fullscreen-recog-text");
        if (fsInitTxt) fsInitTxt.textContent = "识别段落";
      }
      $("hint").textContent = isIPad
        ? '支持 Apple Pencil 与手写\n双指缩放或漫游画布，可框选移动文字与想法'
        : '单指书写，两指缩放或移动画布\n可框选移动文字、想法和公式';
    } else {
      $("hint").textContent = isIPad
        ? '支持 Apple Pencil 与手写\n双指缩放或漫游画布，写好后点「识别公式」'
        : '单指书写，两指缩放或移动画布\n写好后点「识别公式」，也可框选移动笔迹';
    }
    if (isIPad && $("ipadTip")) $("ipadTip").style.display = "block";
    $("serverInput").placeholder = location.origin + "/";
    setWritingFullscreen(landscape.matches);
    fitCanvas();
    updatePalmRestLayout();
    if (window.ResizeObserver) new ResizeObserver(scheduleFit).observe(stage);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", scheduleFit);
    var onOrientation = function () {
      userToggledFullscreen = false;
      setWritingFullscreen(landscape.matches);
    };
    if (landscape.addEventListener) landscape.addEventListener("change", onOrientation);
    else landscape.addListener(onOrientation);
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
    document.addEventListener("dblclick", function (e) { e.preventDefault(); });

    var helloPage = currentPageId(), helloEdit = editVersion;
    api("/api/hello", { device: navigator.userAgent, client: CLIENT_ID },
        function (status, data) {
      if (status === 200 && data) {
        if (data.protocol && PROTOCOL && data.protocol !== PROTOCOL) {
          toast("请刷新页面（服务器已更新）");
        }
        if (data.mode !== undefined) applyMode(data.mode);
        if (data.session) serverSession = data.session;
        if (typeof data.rev === "number") serverRev = data.rev;
        var helloState = data.state || data;
        if (pagesEnabled && restoredPages) maybeAdoptServerDoc(helloState);
        if (typeof helloState.clearedSeq === "number") serverCleared = helloState.clearedSeq;
        // 刷新页面后：本地为空而电脑上还有内容 -> 接过来继续写
        if ((!pagesEnabled || (!restoredPages && pages.length === 1 && currentPageId() === helloPage && editVersion === helloEdit)) && data.doc && (data.doc.strokes || []).length && !doc.strokes.length
            && !locked()) {
          if (pagesEnabled && data.state && data.state.pageId) pages[pageIndex].id = data.state.pageId;
          adopt(data.doc);
        }
        if (data.state) {
          if (data.state.session) serverSession = data.state.session;
          if (data.state.mode !== undefined) applyMode(data.state.mode);
          if (data.state.recognizing) setBusy(!locked());
          var r0 = data.state.result;
          if (r0 && r0.mode && r0.mode !== "phone") r0 = null;
          if (!pagesEnabled || !data.state.pageId || data.state.pageId === currentPageId()) applyResult(r0, data.state.error, null);
        }
        setStatus(locked() ? "电脑鼠标手写中" : "已连接", true);
        if (pagesEnabled) { dirty = true; queueSync(); }
      } else if (status === 403) {
        setStatus("token 错误", false);
        $("err").textContent = "连接被拒绝：访问地址里的 token 不正确，请重新扫二维码。";
        $("err").className = "show";
      } else {
        setStatus("未连接", false);
      }
    });

    connect();
    pollTimer = setInterval(function () {
      // 暂停期间也要轮询：电脑端切回手机手写时得第一时间知道
      poll();
      if (dirty && !locked()) syncNow();
      if (ws && wsReady && Date.now() - lastWsMessage > 20000) ws.close();
      if (!ws) connect();
    }, 1500);
    window.addEventListener("resize", scheduleFit);
    window.addEventListener("orientationchange", function () {
      setTimeout(scheduleFit, 250);
    });
    setInterval(function () { send({ type: "ping", t: Date.now() }); }, 8000);
    function resumeSync() { if (!document.hidden) { poll(); if (dirty) syncNow(); if (!ws) connect(); } }
    window.addEventListener('online', resumeSync);
    document.addEventListener('visibilitychange', resumeSync);
    window.addEventListener("beforeunload", function () { if (dirty) syncNow(); });
  }

  init();
})();
</script>
</body>
</html>
